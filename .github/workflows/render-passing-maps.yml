name: Render player passing maps

on:
  push:
    paths:
      - "scripts/export_passing_maps.py"
      - ".github/workflows/render-passing-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install "statsbombpy" "mplsoccer" "matplotlib" "pandas"

      - name: Render maps
        run: python scripts/export_passing_maps.py

      - name: Commit generated maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualizations/passing-maps/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add four passing map visualizations"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "Passing maps are already up to date."
          fi
